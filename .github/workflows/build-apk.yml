name: Build Stockholm Metro Radar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build Android APK
        run: |
          PROJECT_FILE=$(find . -maxdepth 3 -name 'settings.gradle.kts' | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "Error: settings.gradle.kts not found. Upload the unzipped Android project files first."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "Building from: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/sthlm-metro-radar.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Stockholm Metro Radar v1.0.${{ github.run_number }}
          body: |
            Automated Android APK build for **Stockholm Metro Radar** (Fullscreen 3D Radar + Native SL Live Departures Home Screen Widget).

            ### Install on Android
            1. Download `sthlm-metro-radar.apk` below on your phone.
            2. Tap the file and allow **Install unknown apps** if prompted.
            3. Long-press your Home Screen → **Widgets** → add **STHLM Metro Radar**.
          files: sthlm-metro-radar.apk
          make_latest: 'true'
